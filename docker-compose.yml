services:
  server:
    build: .
    profiles:
      - server
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./server/config.template.json:/etc/xray/config.template.json:ro
      - ./certs:/etc/ssl/xray:rw
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pidof xray || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  client:
    build: .
    profiles:
      - client
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-10808}:${PROXY_PORT:-10808}"
      - "10809:10809"
    volumes:
      - ./client/config.template.json:/etc/xray/config.template.json:ro
    env_file:
      - .env
